<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup Google Form SMAN 97 Jakarta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0ebf8] font-sans min-h-screen py-8 px-4 flex flex-col items-center justify-start">

  <div class="w-full max-w-2xl bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden mb-6">
    
    <div class="bg-[#673ab7] p-6 text-white">
      <h1 class="text-2xl font-semibold">Permintaan pembuatan surat</h1>
      <p class="text-sm opacity-90 mt-1">SMAN 97 Jakarta — Tata Usaha</p>
      
      <div class="mt-6">
        <div class="flex justify-between text-xs font-medium mb-1">
          <span>Langkah 1 dari 4</span>
          <span>25%</span>
        </div>
        <div class="w-full bg-[#512da8] h-1.5 rounded-full">
          <div class="bg-white h-1.5 rounded-full transition-all duration-300" style="width: 25%"></div>
        </div>
      </div>
    </div>

    <form class="p-6 space-y-6">
      
      <div class="border-b pb-2">
        <h2 class="text-lg font-medium text-gray-900">Identitas pemohon</h2>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-800">Saya adalah <span class="text-red-500">*</span></label>
        <select id="roleSelect" class="w-full md:w-1/3 p-2.5 border border-gray-300 rounded-md bg-white focus:outline-none focus:border-[#673ab7] focus:ring-1 focus:ring-[#673ab7] text-sm text-gray-700">
          <option value="Siswa">Siswa</option>
          <option value="Guru">Guru/Staff</option>
        </select>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-sm font-medium text-gray-800">Nama lengkap <span class="text-red-500">*</span></label>
        <input type="text" placeholder="Contoh: Budi Santoso" required class="w-full pb-1.5 border-b-2 border-gray-200 focus:outline-none focus:border-[#673ab7] transition-colors text-sm placeholder-gray-400">
      </div>

      <div id="siswaFields" class="space-y-6">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-800">Kelas</label>
          <input type="text" placeholder="Contoh: XII MIPA 3" class="w-full pb-1.5 border-b-2 border-gray-200 focus:outline-none focus:border-[#673ab7] transition-colors text-sm placeholder-gray-400">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-800">NIS</label>
          <input type="number" placeholder="Contoh: 14567" class="w-full pb-1.5 border-b-2 border-gray-200 focus:outline-none focus:border-[#673ab7] transition-colors text-sm placeholder-gray-400 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-800">NISN</label>
          <input type="number" placeholder="Contoh: 0087654321" class="w-full pb-1.5 border-b-2 border-gray-200 focus:outline-none focus:border-[#673ab7] transition-colors text-sm placeholder-gray-400 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-gray-800">Tempat, tanggal lahir</label>
          <input type="text" placeholder="Contoh: Jakarta, 17 Agustus 2005" class="w-full pb-1.5 border-b-2 border-gray-200 focus:outline-none focus:border-[#673ab7] transition-colors text-sm placeholder-gray-400">
        </div>
      </div>
